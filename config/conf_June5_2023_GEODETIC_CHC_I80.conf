# ============================================================================
# conf_June5_2023_GEODETIC_CHC_I80.conf
# 05 June 2023 | RTKLIB demo5 b34k | PPP-static float
#
# Methodological rule:
#   Physical modelling is kept common across receiver classes.
#   Only receiver-dependent tracking/stochastic parameters are adapted.
#   Precise SP3/CLK/BIA are supplied by the batch command line.
# ============================================================================

# --- COZUM MODU ------------------------------------------------------------
pos1-posmode        =ppp-static # PPP static
pos1-frequency      =l1+l2+l5 # CHC I80 multi-frequency observations
pos1-soltype        =combined-nophasereset # forward+backward combined
pos1-elmask         =5 # common elevation mask for all receivers
                                # UQS-Golden dusuk-elev kalitesini F-skoruyla zaten puanliyor;
                                # RTKLIB'e 5-10 bantindaki gozlemleri de GORMESINI istiyoruz
                                # (VDOP icin kritik). Gevsek-conf felsefesiyle uyumlu.
pos1-snrmask_r      =off # avoid receiver-class-specific SNR censoring
pos1-snrmask_b      =off
pos1-snrmask_L1    =35,35,35,35,35,35,35,35,35 # snrmask_r=off iken devre disi
pos1-snrmask_L2    =32,32,32,32,32,32,32,32,32 # devre disi
pos1-snrmask_L5    =32,32,32,32,32,32,32,32,32 # devre disi
pos1-dynamics       =off # static experiment
pos1-tidecorr       =on # solid Earth + pole tide; no BLQ dependency
                                # file-blqfile SART; bos ise yalniz kati+kutup uygulanir.
                                # Istanbul kiyisinda OTL dusey ~5-10 mm -> BLQ uretin (Chalmers/OSO servisi)
pos1-ionoopt        =dual-freq # ionosphere-free dual-frequency PPP
pos1-tropopt        =est-ztdgrad # estimate ZTD + horizontal gradients
pos1-sateph         =precise # SP3/CLK
pos1-posopt1        =on
pos1-posopt2        =on
pos1-posopt3        =on
pos1-posopt4        =on
pos1-posopt5        =on
pos1-posopt6        =on
pos1-exclsats      =            # Bos: dislama karari UQS'nin isi
pos1-navsys         =45 # GPS+GLONASS+Galileo+BeiDou
                                # (bit haritasi: 1:gps 2:sbas 4:glo 8:gal 16:qzs 32:bds)

# --- AMBIGUITY (FLOAT PPP) --------------------------------------------------
pos2-armode         =off # Stage-1 float PPP baseline
                                # float, literaturde RTKLIB-PPP standardi (dogru tercih)
pos2-gloarmode      =off
pos2-bdsarmode      =off
pos2-arfilter       =off
pos2-arthres       =3           # (AR kapali; dokunulmadi)
pos2-arthresmin    =3.0
pos2-arthresmax    =999
pos2-arthres1      =0.1
pos2-arthres2      =0
pos2-arthres3      =1e-09
pos2-arthres4      =1e-05
pos2-varholdamb    =0.1
pos2-gainholdamb   =0.05
pos2-arlockcnt     =10
pos2-minfixsats    =6
pos2-minholdsats   =4
pos2-mindropsats   =8
pos2-arelmask      =0           # AR kapali -> etkisiz
pos2-arminfix      =5
pos2-armaxiter     =1
pos2-elmaskhold    =0           # AR kapali -> etkisiz (15 gereksizdi)
pos2-aroutcnt      =5
pos2-maxage        =30          # (s) SP3/CLK interpolasyon yasi; 30 s standart
pos2-syncsol       =off

# --- KALITE KAPILARI (UQS-SONRASI GEVSEK = BACKSTOP) -------------------------
pos2-slipthres      =0.10 # geodetic backstop; QC handled separately
                                # ele aldigi icin 0.10'a GEVSETILDI -> iyonosferik dalgalanmada
                                # yalanci reset onlenir (gevsek-conf hipotezi)
pos2-dopthres       =5 # demo5 Doppler-TDCP backstop
                                # NOT GDOP DEGIL! (onceki yorum hataliydi). 5 = standart backstop
pos2-rejionno       =30
pos2-rejcode        =30
                                # temizledi; cozucu kapisi yalniz kaba hatayi tutsun
pos2-niter         =1           # Statikte 1 iterasyon yeterli (matris kararliligi)
pos2-baselen       =0           # PPP -> baz yok
pos2-basesig       =0

# --- CIKTI -------------------------------------------------------------------
out-solformat       =xyz # ECEF output required by v6 analysis
out-outhead         =on
out-outopt          =on
out-outvel          =off
out-timesys         =gpst
out-timeform        =hms
out-timendec        =3
out-degform        =deg
out-fieldsep       =
out-outsingle       =off
out-maxsolstd       =0
out-height          =ellipsoidal
out-geoid          =internal    # xyz ciktida geoid kullanilmaz (TG-20 yalniz ortometrik cikti icin)
out-solstatic       =all # retain every epoch for convergence/time-series analysis
out-nmeaintv1      =0
out-nmeaintv2      =0
out-outstat         =off # residual output can be enabled in a separate experiment

# --- STOKASTIK MODEL (GEODETIK) ----------------------------------------------
stats-eratio1       =100
stats-eratio2       =100
stats-eratio5       =100
stats-errphase      =0.003 # geodetic carrier-phase model
stats-errphaseel    =0.003
stats-errphasebl   =0           # PPP -> baz uzunlugu terimi yok
stats-errdoppler   =10          # (Hz)
stats-snrmax       =0
stats-errsnr       =0
stats-errrcv       =0
stats-stdbias      =30          # (m) Ambiguity baslangic belirsizligi (genis=guvenli)
stats-stdiono      =0.03        # (m) IFLC'de iyono durumu YOK -> etkisiz (est-stec icindir)
stats-stdtrop      =0.3         # (m) ZTD baslangic std
stats-prnaccelh    =0.01        # dynamics=off -> etkisiz
stats-prnaccelv    =0.01        # etkisiz
stats-prnbias       =0.0001
stats-prniono      =0.001       # IFLC'de etkisiz
stats-prntrop       =0.0001
stats-prnpos       =0           # Statik -> konum surec gurultusu 0 (dogru)
stats-clkstab       =5e-12

# --- ANTEN --------------------------------------------------------------------
ant1-postype        =rinexhead # initial position from each RINEX header
ant1-pos1           =0
ant1-pos2           =0
ant1-pos3           =0
ant1-anttype        =* # use RINEX antenna type where available
ant1-antdele        =0
ant1-antdeln        =0
ant1-antdelu        =0
ant2-postype       =xyz         # PPP -> ant2 kullanilmaz
ant2-pos1          =0
ant2-pos2          =0
ant2-pos3          =0
ant2-anttype       =
ant2-antdele       =0
ant2-antdeln       =0
ant2-antdelu       =0
ant2-maxaveep      =1
ant2-initrst       =on

# --- DIGER ---------------------------------------------------------------------
misc-timeinterp     =on # precise product interpolation
misc-sbasatsel     =0
misc-rnxopt1       =
misc-rnxopt2       =
misc-pppopt        =

