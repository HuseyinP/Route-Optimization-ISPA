# ============================================================================
# conf_June5_2023_SMARTPHONE_XIAOMI.conf
# 05 June 2023 | RTKLIB demo5 b34k | PPP-static float
#
# Methodological rule:
#   Physical modelling is kept common across receiver classes.
#   Only receiver-dependent tracking/stochastic parameters are adapted.
#   Precise SP3/CLK/BIA are supplied by the batch command line.
# ============================================================================

# --- COZUM MODU ------------------------------------------------------------
pos1-posmode        =ppp-static # PPP static
pos1-frequency      =l1+l2+l5 # allows L1/L5 and available multi-GNSS slots
pos1-soltype        =combined-nophasereset # forward+backward combined
pos1-elmask         =5 # common elevation mask for all receivers
                                # UQS-Golden dusuk-elev kalitesini F-skoruyla zaten puanliyor;
                                # RTKLIB'e 5-10 bantindaki gozlemleri de GORMESINI istiyoruz
                                # (VDOP icin kritik). Gevsek-conf felsefesiyle uyumlu.
pos1-snrmask_r      =off # avoid receiver-class-specific SNR censoring
                                # cift filtre = ayni gozlemi iki kez cezalandirmak
pos1-snrmask_b      =off
pos1-snrmask_L1    =26,26,26,26,26,26,26,26,26 # snrmask_r=off iken devre disi (referans olarak birakildi)
pos1-snrmask_L2    =24,24,24,24,24,24,24,24,24 # devre disi
pos1-snrmask_L5    =24,24,24,24,24,24,24,24,24 # devre disi
pos1-dynamics       =off # static experiment
pos1-tidecorr       =on # solid Earth + pole tide; no BLQ dependency
                                # (~cm-dm) cok altinda; kati yer + kutup yeterli
pos1-ionoopt        =dual-freq # ionosphere-free dual-frequency PPP
pos1-tropopt        =est-ztdgrad # estimate ZTD + horizontal gradients
pos1-sateph         =precise # SP3/CLK
pos1-posopt1        =on
pos1-posopt2        =on
pos1-posopt3        =on
pos1-posopt4        =on
pos1-posopt5        =on
pos1-posopt6        =on
pos1-exclsats      =
pos1-navsys         =41 # GPS+Galileo+BeiDou; GLONASS excluded from IF dual-frequency PPP
                                # (L1) izlenir -> IFLC kurulamaz + FDMA alici-ici bias; literatur
                                # smartphone PPP'de GPS+GAL+BDS standardi
                                # (bit haritasi: 1:gps 2:sbas 4:glo 8:gal 16:qzs 32:bds)

# --- AMBIGUITY (FLOAT PPP) --------------------------------------------------
pos2-armode         =off # Stage-1 float PPP baseline
                                # AR anlamsiz + RTKLIB PPP-AR urun destegi sinirli
pos2-gloarmode      =off
pos2-bdsarmode      =off
pos2-arfilter       =off
pos2-arthres       =3
pos2-arthresmin    =2.5
pos2-arthresmax    =999
pos2-arthres1      =0.1
pos2-arthres2      =0
pos2-arthres3      =1e-09
pos2-arthres4      =1e-05
pos2-varholdamb    =0.1
pos2-gainholdamb   =0.05
pos2-arlockcnt     =10
pos2-minfixsats    =6
pos2-minholdsats   =4
pos2-mindropsats   =8
pos2-arelmask      =0           # AR kapali -> etkisiz (15 gereksizdi)
pos2-arminfix      =5
pos2-armaxiter     =1
pos2-elmaskhold    =0           # AR kapali -> etkisiz
pos2-aroutcnt      =5
pos2-maxage        =30          # (s)
pos2-syncsol       =off

# --- KALITE KAPILARI (UQS-SONRASI GEVSEK = BACKSTOP) -------------------------
pos2-slipthres      =0.15 # looser smartphone GF backstop
                                # reset uretir; UQS+BCP slipleri onceden ele aldi -> 0.15 backstop
pos2-dopthres       =10 # looser Doppler-TDCP backstop for handset tracking
                                # duty-cycle yuzunden guvenilmez -> genis esik = yalanci-reset yok
pos2-rejionno       =100 # retain large but potentially valid smartphone innovations
                                # basindaki buyuk-ama-gecerli inovasyonlar atilmasin
pos2-rejcode        =50 # smartphone code-noise backstop
                                # UQS kod-MP kanali temizledi -> 50 m yalniz kaba-hata kapisi
pos2-niter         =1
pos2-baselen       =0
pos2-basesig       =0

# --- CIKTI -------------------------------------------------------------------
out-solformat       =xyz # ECEF output required by v6 analysis
out-outhead         =on
out-outopt          =on
out-outvel          =off
out-timesys         =gpst
out-timeform        =hms
out-timendec        =3
out-degform        =deg
out-fieldsep       =
out-outsingle       =off
out-maxsolstd       =0
out-height          =ellipsoidal
out-geoid          =internal
out-solstatic       =all # retain every epoch for convergence/time-series analysis
out-nmeaintv1      =0
out-nmeaintv2      =0
out-outstat         =off # residual output can be enabled in a separate experiment

# --- STOKASTIK MODEL (SMARTPHONE GERCEGI) --------------------------------------
stats-eratio1       =300 # receiver-adapted smartphone code/phase weighting
stats-eratio2       =300
stats-eratio5       =300
stats-errphase      =0.006 # smartphone phase-noise model
                                # 0.02 fazi asiri cezalandirip yakinsamayi yavaslatiyordu
stats-errphaseel    =0.006
stats-errphasebl   =0
stats-errdoppler   =10          # (Hz)
stats-snrmax       =0
stats-errsnr       =0
stats-errrcv       =0
stats-stdbias      =30          # (m)
stats-stdiono      =0.05        # IFLC'de etkisiz (est-stec icindir)
stats-stdtrop      =0.3         # (m) 0.5 -> 0.3: standart; asiri genis baslangic gerekmiyor
stats-prnaccelh    =0.01        # dynamics=off -> etkisiz
stats-prnaccelv    =0.01
stats-prnbias       =0.001 # larger ambiguity process noise for handset phase instability
                                # ambiguity'ye daha genis yuruyus (rtklibexplorer Mi8 ayari)
stats-prniono      =0.001       # IFLC'de etkisiz
stats-prntrop       =0.0001
                                # hatasini YUKSEKLIGE sizdirir (amaclananin tam tersi)
stats-prnpos       =0
stats-clkstab       =5e-12
                                # alici TCXO'su zaten epok-bazinda beyaz-gurultu kestirilir

# --- ANTEN --------------------------------------------------------------------
ant1-postype        =rinexhead # initial position from each RINEX header
ant1-pos1           =0
ant1-pos2           =0
ant1-pos3           =0
ant1-anttype        =* # use RINEX antenna type where available
ant1-antdele        =0
ant1-antdeln        =0
ant1-antdelu        =0
                                # ground_truth.csv 'antenna_height' sutunuyla ele aliniyor;
                                # burada da girilirse CIFT duzeltme olur!
ant2-postype       =xyz
ant2-pos1          =0
ant2-pos2          =0
ant2-pos3          =0
ant2-anttype       =
ant2-antdele       =0
ant2-antdeln       =0
ant2-antdelu       =0
ant2-maxaveep      =1
ant2-initrst       =on

# --- DIGER ---------------------------------------------------------------------
misc-timeinterp     =on # precise product interpolation
misc-sbasatsel     =0
misc-rnxopt1       =
misc-rnxopt2       =
misc-pppopt        =

